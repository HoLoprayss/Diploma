<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Шоколадка -->
  <rect x="6" y="8" width="6" height="8" rx="1" fill="none" stroke="#666666" stroke-width="1.5"/>
  
  <!-- Сегменты шоколада -->
  <line x1="6" y1="10.5" x2="12" y2="10.5" stroke="#999999" stroke-width="0.5"/>
  <line x1="6" y1="13" x2="12" y2="13" stroke="#999999" stroke-width="0.5"/>
  <line x1="9" y1="8" x2="9" y2="16" stroke="#999999" stroke-width="0.5"/>
  
  <!-- Обертка шоколада -->
  <rect x="5.5" y="7" width="7" height="2" rx="0.5" fill="none" stroke="#999999" stroke-width="0.5"/>
  
  <!-- Чипсы -->
  <ellipse cx="16" cy="10" rx="2" ry="1" fill="none" stroke="#666666" stroke-width="1.5" transform="rotate(15 16 10)"/>
  <ellipse cx="17.5" cy="12" rx="1.8" ry="0.9" fill="none" stroke="#666666" stroke-width="1.5" transform="rotate(-10 17.5 12)"/>
  <ellipse cx="15" cy="13" rx="1.6" ry="0.8" fill="none" stroke="#666666" stroke-width="1.5" transform="rotate(25 15 13)"/>
  
  <!-- Конфета -->
  <ellipse cx="4" cy="18" rx="1.5" ry="1" fill="none" stroke="#666666" stroke-width="1.5"/>
  
  <!-- Печенье -->
  <circle cx="19" cy="18" r="2" fill="none" stroke="#666666" stroke-width="1.5"/>
  <circle cx="18.5" cy="17.5" r="0.3" fill="#999999"/>
  <circle cx="19.5" cy="18.5" r="0.3" fill="#999999"/>
</svg>