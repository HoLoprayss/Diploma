<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Бутылка моющего средства -->
  <rect x="9" y="6" width="6" height="12" rx="1" fill="none" stroke="#666666" stroke-width="2"/>
  
  <!-- Горлышко бутылки -->
  <rect x="10.5" y="4" width="3" height="2.5" rx="0.5" fill="none" stroke="#666666" stroke-width="1.5"/>
  
  <!-- Крышка-дозатор -->
  <rect x="10" y="2" width="4" height="2" rx="1" fill="none" stroke="#666666" stroke-width="1"/>
  
  <!-- Этикетка -->
  <rect x="10" y="9" width="4" height="3" rx="0.5" fill="none" stroke="#999999" stroke-width="1"/>
  
  <!-- Линии на этикетке -->
  <line x1="10.5" y1="10" x2="13.5" y2="10" stroke="#999999" stroke-width="0.5"/>
  <line x1="10.5" y1="11" x2="13" y2="11" stroke="#999999" stroke-width="0.5"/>
  
  <!-- Губка -->
  <rect x="4" y="15" width="3" height="1.5" rx="0.5" fill="none" stroke="#999999" stroke-width="1"/>
</svg>