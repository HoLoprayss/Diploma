<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Основной корпус холодильника -->
  <rect x="6" y="2" width="12" height="20" rx="1" fill="none" stroke="#666666" stroke-width="1.5"/>
  
  <!-- Разделитель между морозилкой и основной камерой -->
  <line x1="6" y1="8" x2="18" y2="8" stroke="#666666" stroke-width="1"/>
  
  <!-- Ручка морозильной камеры -->
  <rect x="16.5" y="4" width="0.5" height="2" rx="0.25" fill="#666666"/>
  
  <!-- Ручка основной камеры -->
  <rect x="16.5" y="10" width="0.5" height="3" rx="0.25" fill="#666666"/>
</svg>